<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="theme-color" content="#0a0e17">
    <title>投资驾驶舱</title>
    <style>
        :root {
            --bg-primary: #0a0e17;
            --bg-secondary: #111827;
            --bg-card: #1a2234;
            --border: #2a3a5a;
            --text-primary: #f0f4f8;
            --text-secondary: #8892a4;
            --accent: #6366f1;
            --accent-light: #818cf8;
            --up: #ef4444;
            --down: #22c55e;
            --warning: #f59e0b;
            --gold: #fbbf24;
            --tab-bar-height: 50px;
            --safe-bottom: env(safe-area-inset-bottom, 0px);
        }
        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        html, body { font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', sans-serif; background: var(--bg-primary); color: var(--text-primary); height: 100%; overflow: hidden; -webkit-font-smoothing: antialiased; }
        .app { height: 100vh; display: flex; flex-direction: column; }

        /* Header */
        .header { background: linear-gradient(135deg, var(--bg-secondary), var(--bg-card)); padding: 8px 12px; padding-top: calc(8px + env(safe-area-inset-top, 0px)); border-bottom: 1px solid var(--border); flex-shrink: 0; z-index: 100; }
        .header-content { max-width: 800px; margin: 0 auto; display: flex; justify-content: space-between; align-items: center; }
        .header h1 { font-size: 16px; font-weight: 700; background: linear-gradient(135deg, var(--accent-light), #a78bfa); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .header .subtitle { font-size: 10px; color: var(--text-secondary); margin-top: 1px; }
        .update-time { font-size: 10px; color: var(--text-secondary); }
        .status-dot { display: inline-block; width: 5px; height: 5px; border-radius: 50%; background: var(--down); margin-right: 3px; }

        /* Content */
        .content { flex: 1; overflow-y: auto; overflow-x: hidden; -webkit-overflow-scrolling: touch; padding-bottom: calc(var(--tab-bar-height) + var(--safe-bottom) + 4px); }
        .content::-webkit-scrollbar { display: none; }
        .container { max-width: 800px; margin: 0 auto; padding: 10px 12px; }

        /* Tab Content */
        .tab-content { display: none; animation: fadeIn 0.25s ease; }
        .tab-content.active { display: block; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }

        /* Card */
        .card { background: var(--bg-card); border: 1px solid var(--border); border-radius: 12px; padding: 12px; margin-bottom: 10px; }
        .card-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
        .card-title { font-size: 11px; font-weight: 600; color: var(--text-secondary); letter-spacing: 0.5px; }
        .card-badge { background: var(--accent); color: white; padding: 2px 8px; border-radius: 20px; font-size: 10px; font-weight: 600; }

        /* ===== 环形图区域 ===== */
        .donut-section { text-align: center; margin-bottom: 6px; }
        .donut-wrap { position: relative; width: 160px; height: 160px; margin: 0 auto; }
        .donut-wrap svg { width: 160px; height: 160px; }
        .donut-center { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); text-align: center; }
        .donut-total-label { font-size: 9px; color: var(--text-secondary); }
        .donut-total-value { font-size: 16px; font-weight: 700; }
        .donut-total-pnl { font-size: 11px; font-weight: 600; }
        .donut-legend { display: flex; flex-wrap: wrap; justify-content: center; gap: 6px 14px; margin-top: 10px; }
        .legend-item { display: flex; align-items: center; gap: 4px; font-size: 10px; color: var(--text-secondary); cursor: pointer; }
        .legend-item:active { opacity: 0.7; }
        .legend-dot { width: 8px; height: 8px; border-radius: 2px; flex-shrink: 0; }
        .legend-pct { font-weight: 600; color: var(--text-primary); margin-left: 2px; }

        /* 穿透面板 */
        .drill-panel { display: none; margin-top: 10px; }
        .drill-panel.active { display: block; animation: fadeIn 0.2s ease; }
        .drill-item { display: flex; justify-content: space-between; align-items: center; padding: 8px 10px; background: var(--bg-secondary); border-radius: 8px; margin-bottom: 4px; font-size: 11px; }
        .drill-item:active { background: rgba(99,102,241,0.1); }
        .drill-name { font-weight: 600; }
        .drill-value { color: var(--text-secondary); }
        .drill-bar { height: 3px; background: var(--bg-primary); border-radius: 2px; margin-top: 4px; }
        .drill-bar-fill { height: 100%; border-radius: 2px; }

        /* ===== 异动提醒 ===== */
        .alert-list { margin-bottom: 10px; }
        .alert-item { display: flex; align-items: flex-start; gap: 8px; padding: 10px; background: var(--bg-card); border: 1px solid var(--border); border-radius: 10px; margin-bottom: 6px; border-left: 3px solid var(--border); }
        .alert-item.red { border-left-color: var(--up); }
        .alert-item.yellow { border-left-color: var(--warning); }
        .alert-item.green { border-left-color: var(--down); }
        .alert-icon { font-size: 14px; flex-shrink: 0; margin-top: 1px; }
        .alert-body { flex: 1; min-width: 0; }
        .alert-title { font-size: 12px; font-weight: 600; margin-bottom: 2px; }
        .alert-desc { font-size: 10px; color: var(--text-secondary); line-height: 1.5; }
        .alert-action { font-size: 10px; color: var(--accent-light); font-weight: 600; margin-top: 4px; display: inline-block; }

        /* ===== 账户速览 ===== */
        .accounts-row { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-bottom: 10px; }
        .account-mini { background: var(--bg-card); border: 1px solid var(--border); border-radius: 10px; padding: 10px 8px; text-align: center; transition: transform 0.15s; cursor: pointer; }
        .account-mini:active { transform: scale(0.96); }
        .account-mini-name { font-size: 11px; font-weight: 600; margin-bottom: 4px; }
        .account-mini-value { font-size: 14px; font-weight: 700; }
        .account-mini-pnl { font-size: 10px; font-weight: 600; margin-top: 2px; }
        .account-mini-pnl.up { color: var(--up); }
        .account-mini-pnl.down { color: var(--down); }
        .account-mini-count { font-size: 9px; color: var(--text-secondary); margin-top: 2px; }

        /* ===== TOP排行 ===== */
        .top-item { display: flex; align-items: center; gap: 8px; padding: 8px 0; border-bottom: 1px solid rgba(42,58,90,0.5); }
        .top-item:last-child { border-bottom: none; }
        .top-rank { width: 18px; height: 18px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 10px; font-weight: 700; flex-shrink: 0; }
        .top-rank.gold { background: rgba(251,191,36,0.2); color: var(--gold); }
        .top-rank.silver { background: rgba(148,163,184,0.2); color: #94a3b8; }
        .top-rank.bronze { background: rgba(180,130,80,0.2); color: #b48250; }
        .top-rank.normal { background: var(--bg-secondary); color: var(--text-secondary); }
        .top-name { flex: 1; font-size: 12px; font-weight: 600; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .top-tag { font-size: 9px; padding: 1px 5px; border-radius: 3px; background: rgba(99,102,241,0.15); color: var(--accent-light); flex-shrink: 0; }
        .top-pnl { font-size: 12px; font-weight: 700; flex-shrink: 0; text-align: right; }
        .top-pnl.up { color: var(--up); }
        .top-pnl.down { color: var(--down); }
        .top-pct { font-size: 9px; color: var(--text-secondary); text-align: right; }

        /* ===== 五池系统 ===== */
        .pool-section { margin-bottom: 12px; }
        .pool-header { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; }
        .pool-icon { width: 24px; height: 24px; border-radius: 6px; display: flex; align-items: center; justify-content: center; font-size: 11px; }
        .pool-icon.diamond { background: rgba(251,191,36,0.15); }
        .pool-icon.holding { background: rgba(239,68,68,0.15); }
        .pool-icon.candidate { background: rgba(34,197,94,0.15); }
        .pool-icon.monitor { background: rgba(245,158,11,0.15); }
        .pool-icon.observe { background: rgba(99,102,241,0.15); }
        .pool-title { font-size: 12px; font-weight: 600; }
        .pool-count { font-size: 10px; color: var(--text-secondary); margin-left: auto; }
        .pool-tags { display: flex; flex-wrap: wrap; gap: 5px; }
        .pool-tag { background: var(--bg-secondary); border: 1px solid var(--border); padding: 5px 9px; border-radius: 6px; font-size: 10px; transition: all 0.15s; }
        .pool-tag:active { background: rgba(99,102,241,0.1); border-color: var(--accent); transform: scale(0.95); }
        .flow-arrow { text-align: center; color: var(--text-secondary); font-size: 14px; margin: 6px 0; opacity: 0.4; }

        /* 五池持仓卡片 */
        .pool-stock { background: var(--bg-secondary); border: 1px solid var(--border); border-radius: 10px; padding: 10px; margin-bottom: 6px; }
        .pool-stock-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px; }
        .pool-stock-name { font-weight: 700; font-size: 13px; }
        .pool-stock-score { font-size: 10px; font-weight: 700; padding: 2px 6px; border-radius: 4px; }
        .pool-stock-body { display: flex; justify-content: space-between; align-items: center; }
        .pool-stock-pnl { font-size: 16px; font-weight: 700; }
        .pool-stock-pnl.up { color: var(--up); }
        .pool-stock-pnl.down { color: var(--down); }
        .pool-stock-info { font-size: 10px; color: var(--text-secondary); text-align: right; }
        .pool-stock-footer { margin-top: 6px; padding-top: 6px; border-top: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; font-size: 10px; }
        .pool-stock-status { font-weight: 600; }
        .pool-stock-actions { display: flex; gap: 6px; }
        .pool-btn { padding: 3px 8px; border-radius: 4px; font-size: 9px; font-weight: 600; border: 1px solid var(--border); background: none; color: var(--text-secondary); cursor: pointer; }
        .pool-btn:active { background: rgba(99,102,241,0.15); color: var(--accent-light); }
        .pool-btn.warn { border-color: rgba(239,68,68,0.3); color: var(--up); }
        .pool-btn.warn:active { background: rgba(239,68,68,0.15); }

        /* 候选池卡片 */
        .candidate-card { background: var(--bg-secondary); border: 1px solid var(--border); border-radius: 10px; padding: 10px; margin-bottom: 6px; }
        .candidate-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 4px; }
        .candidate-name { font-weight: 700; font-size: 13px; }
        .candidate-score { font-size: 10px; font-weight: 700; padding: 2px 6px; border-radius: 4px; }
        .candidate-desc { font-size: 10px; color: var(--text-secondary); margin-bottom: 6px; }
        .candidate-price { font-size: 10px; color: var(--accent-light); margin-bottom: 6px; }
        .candidate-actions { display: flex; gap: 6px; }

        /* ===== 操作清单 ===== */
        .todo-item { display: flex; align-items: center; gap: 8px; padding: 8px 10px; background: var(--bg-secondary); border-radius: 8px; margin-bottom: 4px; font-size: 11px; }
        .todo-check { width: 16px; height: 16px; border: 1.5px solid var(--border); border-radius: 4px; flex-shrink: 0; cursor: pointer; display: flex; align-items: center; justify-content: center; font-size: 10px; color: transparent; transition: all 0.15s; }
        .todo-check.done { background: var(--accent); border-color: var(--accent); color: white; }
        .todo-text { flex: 1; }
        .todo-text.done { text-decoration: line-through; opacity: 0.5; }

        /* ===== 分析 ===== */
        .summary-row { display: flex; justify-content: space-around; padding: 12px; background: var(--bg-secondary); border-radius: 10px; margin-bottom: 10px; }
        .summary-item { text-align: center; }
        .summary-value { font-size: 16px; font-weight: 700; }
        .summary-value.up { color: var(--up); }
        .summary-value.down { color: var(--down); }
        .summary-label { font-size: 9px; color: var(--text-secondary); margin-top: 2px; }

        .bar-item { margin-bottom: 10px; }
        .bar-header { display: flex; justify-content: space-between; font-size: 11px; margin-bottom: 4px; }
        .bar-name { font-weight: 600; }
        .bar-value { color: var(--text-secondary); }
        .bar-track { height: 6px; background: var(--bg-secondary); border-radius: 3px; overflow: hidden; }
        .bar-fill { height: 100%; border-radius: 3px; transition: width 0.5s ease; }

        .kpi-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; }
        .kpi-card { background: var(--bg-secondary); border-radius: 10px; padding: 12px; text-align: center; }
        .kpi-value { font-size: 18px; font-weight: 700; }
        .kpi-value.green { color: var(--down); }
        .kpi-value.red { color: var(--up); }
        .kpi-label { font-size: 10px; color: var(--text-secondary); margin-top: 3px; }

        .env-row { margin-bottom: 10px; }
        .env-header { display: flex; justify-content: space-between; font-size: 11px; margin-bottom: 4px; }
        .env-score { font-weight: 600; }

        /* Risk Banner */
        .risk-banner { background: rgba(99,102,241,0.08); border: 1px solid rgba(99,102,241,0.2); border-radius: 10px; padding: 10px; margin-bottom: 10px; display: flex; align-items: flex-start; gap: 8px; }
        .risk-icon { font-size: 14px; flex-shrink: 0; }
        .risk-text { font-size: 10px; color: var(--text-secondary); line-height: 1.6; }
        .risk-text strong { color: var(--text-primary); }

        /* ===== Tab Bar ===== */
        .tab-bar { position: fixed; bottom: 0; left: 0; right: 0; height: calc(var(--tab-bar-height) + var(--safe-bottom)); background: rgba(17,24,39,0.95); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px); border-top: 1px solid var(--border); display: flex; justify-content: space-around; align-items: center; padding-top: 4px; z-index: 1000; }
        .tab-item { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 2px 0 calc(2px + var(--safe-bottom)); cursor: pointer; transition: all 0.2s ease; position: relative; }
        .tab-item:active { transform: scale(0.9); }
        .tab-icon { font-size: 18px; line-height: 1; margin-bottom: 2px; opacity: 0.5; transition: all 0.2s ease; }
        .tab-label { font-size: 9px; font-weight: 500; color: var(--text-secondary); transition: all 0.2s ease; }
        .tab-item.active .tab-icon { opacity: 1; transform: translateY(-1px); }
        .tab-item.active .tab-label { color: var(--accent-light); font-weight: 600; }
        .tab-item.active::before { content: ''; position: absolute; top: -4px; width: 32px; height: 2px; background: var(--accent); border-radius: 0 0 2px 2px; }
    </style>
</head>
<body>
<div class="app">
    <div class="header">
        <div class="header-content">
            <div><h1>投资驾驶舱</h1><div class="subtitle">A公子 · 趋势投资系统</div></div>
            <div><div class="update-time"><span class="status-dot"></span><span id="updateTime">--</span></div></div>
        </div>
    </div>

    <div class="content">
        <div class="container">
            <!-- ===== TAB: 总览 ===== -->
            <div id="tab-overview" class="tab-content active">
                <!-- 资产配置全景 -->
                <div class="card">
                    <div class="card-header"><span class="card-title">💰 资产配置全景</span></div>
                    <div class="donut-section">
                        <div class="donut-wrap">
                            <svg viewBox="0 0 160 160" id="donutChart"></svg>
                            <div class="donut-center">
                                <div class="donut-total-label">总资产</div>
                                <div class="donut-total-value" id="donutTotal">--</div>
                                <div class="donut-total-pnl" id="donutPnl">--</div>
                            </div>
                        </div>
                        <div class="donut-legend" id="donutLegend"></div>
                    </div>
                    <!-- 穿透面板 -->
                    <div class="drill-panel" id="drillPanel"></div>
                </div>

                <!-- 异动提醒 -->
                <div class="card-header"><span class="card-title">⚠️ 异动提醒</span><span class="card-badge" id="alertCount">0项</span></div>
                <div class="alert-list" id="alertList"></div>

                <!-- 三账户速览 -->
                <div class="accounts-row" id="accountsRow"></div>

                <!-- 持仓TOP 5 -->
                <div class="card">
                    <div class="card-header"><span class="card-title">🏆 持仓TOP 5</span></div>
                    <div id="topList"></div>
                </div>
            </div>

            <!-- ===== TAB: 决策 ===== -->
            <div id="tab-decision" class="tab-content">
                <div class="risk-banner">
                    <div class="risk-icon">💎</div>
                    <div class="risk-text"><strong>五池动态管理系统</strong><br>观察池→监控池→候选池→持仓池 | 金刚池→持仓池<br>淘汰规则：止损-8% · 止盈+30% · 趋势走坏 · 评分&lt;70</div>
                </div>

                <!-- 金刚池 -->
                <div class="pool-section" id="poolDiamond"></div>

                <!-- 持仓池 -->
                <div class="pool-section" id="poolHolding"></div>

                <div class="flow-arrow">↓</div>

                <!-- 候选池 -->
                <div class="pool-section" id="poolCandidate"></div>

                <div class="flow-arrow">↓</div>

                <!-- 监控池 -->
                <div class="pool-section" id="poolMonitor"></div>

                <div class="flow-arrow">↓</div>

                <!-- 观察池 -->
                <div class="pool-section" id="poolObserve"></div>

                <!-- 今日操作清单 -->
                <div class="card">
                    <div class="card-header"><span class="card-title">⚡ 今日操作清单</span></div>
                    <div id="todoList"></div>
                </div>
            </div>

            <!-- ===== TAB: 分析 ===== -->
            <div id="tab-analysis" class="tab-content">
                <div class="summary-row" id="summaryRow"></div>

                <div class="card">
                    <div class="card-header"><span class="card-title">账户贡献度</span></div>
                    <div id="contributionBars"></div>
                </div>

                <div class="card">
                    <div class="card-header"><span class="card-title">行业/类型分布</span></div>
                    <div id="sectorBars"></div>
                </div>

                <div class="card">
                    <div class="card-header"><span class="card-title">交易统计</span></div>
                    <div class="kpi-grid">
                        <div class="kpi-card"><div class="kpi-value green">68.5%</div><div class="kpi-label">胜率</div></div>
                        <div class="kpi-card"><div class="kpi-value green">2.35</div><div class="kpi-label">盈亏比</div></div>
                        <div class="kpi-card"><div class="kpi-value red">-12.8%</div><div class="kpi-label">最大回撤</div></div>
                        <div class="kpi-card"><div class="kpi-value green">1.85</div><div class="kpi-label">夏普比率</div></div>
                    </div>
                </div>

                <div class="card">
                    <div class="card-header"><span class="card-title">市场环境评分</span></div>
                    <div id="envScores"></div>
                </div>

                <div class="card">
                    <div class="card-header"><span class="card-title">风险预算</span></div>
                    <div class="bar-item">
                        <div class="bar-header"><span class="bar-name">风险使用</span><span class="bar-value" style="color:var(--warning)">72%</span></div>
                        <div class="bar-track"><div class="bar-fill" style="width:72%;background:var(--warning)"></div></div>
                    </div>
                    <div style="display:flex;justify-content:space-around;font-size:10px;color:var(--text-secondary);margin-top:8px;">
                        <span>股票 72%</span><span>基金 20%</span><span>现金 8%</span>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Tab Bar -->
    <div class="tab-bar">
        <div class="tab-item active" onclick="switchTab('overview',this)"><div class="tab-icon">📊</div><div class="tab-label">总览</div></div>
        <div class="tab-item" onclick="switchTab('decision',this)"><div class="tab-icon">🎯</div><div class="tab-label">决策</div></div>
        <div class="tab-item" onclick="switchTab('analysis',this)"><div class="tab-icon">📈</div><div class="tab-label">分析</div></div>
    </div>
</div>

<script>
// ===== 数据 =====
const DATA = {
    agongzi: {
        label: 'A公子', stocks: [
            { name: '兆易创新', code: '603986.SH', qty: 300, cost: 353.639, price: 468.74, tag: '芯片', score: 92 },
            { name: '东山精密', code: '002384.SZ', qty: 200, cost: 155.127, price: 220.55, tag: '精密制造', score: 85 },
            { name: '生益科技', code: '600183.SH', qty: 800, cost: 115.495, price: 115.05, tag: '电子', score: 80 },
            { name: '宏和科技', code: '603256.SH', qty: 600, cost: 170.125, price: 167.72, tag: '科技', score: 82 },
            { name: '东材科技', code: '601208.SH', qty: 500, cost: 53.647, price: 55.17, tag: '材料', score: 72 },
            { name: '科创芯片ETF华安', code: '588290.SH', qty: 9000, cost: 1.24, price: 3.565, tag: 'ETF', score: 95 },
            { name: '中国平安', code: '601318.SH', qty: 100, cost: -9.338, price: 53.68, tag: '金融', score: 78 }
        ], cash: 104615.52
    },
    alipay: {
        label: '支付宝', funds: [
            { name: '永赢科技智选混合C', code: '022365', qty: 29155.82, cost: 2.8519, nav: 5.4687, tag: '科技' },

// ===== 工具 =====
const fmt = n => Math.round(n).toLocaleString('zh-CN');
const fmtDec = n => n.toLocaleString('zh-CN',{minimumFractionDigits:2,maximumFractionDigits:2});
const fmtPct = n => (n>=0?'+':'')+n.toFixed(2)+'%';
const pnlCls = n => n>=0?'up':'down';

function calcStock(s) {
    const market = s.qty * s.price, costTotal = s.qty * s.cost, pnl = market - costTotal;
    const pnlPct = costTotal !== 0 ? (pnl / Math.abs(costTotal)) * 100 : 0;
    const stopLoss = s.cost > 0 ? s.cost * 0.92 : s.price * 0.92;
    const takeProfit = s.cost > 0 ? s.cost * 1.30 : s.price * 1.30;
    const moveStop = pnlPct > 15 ? s.price * 0.85 : stopLoss;
    const stopDist = ((s.price - stopLoss) / s.price * 100).toFixed(1);
    const tpDist = ((takeProfit - s.price) / s.price * 100).toFixed(1);
    let status = '持有', statusColor = 'var(--text-secondary)';
    if (stopDist < 3) { status = '⚠️ 接近止损'; statusColor = 'var(--up)'; }
    else if (pnlPct > 50) { status = '🔥 强势'; statusColor = 'var(--up)'; }
    else if (pnlPct > 20) { status = '📈 上涨'; statusColor = 'var(--down)'; }
    else if (s.score >= 90) { status = '✨ 优秀'; statusColor = 'var(--gold)'; }
    return { ...s, market, pnl, pnlPct, stopLoss, takeProfit, moveStop, stopDist, tpDist, status, statusColor };
}
function calcFund(f) {
    const market = f.qty * f.nav, costTotal = f.qty * f.cost, pnl = market - costTotal;
    const pnlPct = costTotal !== 0 ? (pnl / Math.abs(costTotal)) * 100 : 0;
    return { ...f, market, pnl, pnlPct };
}

// ===== Tab =====
function switchTab(name, el) {
    document.querySelectorAll('.tab-item').forEach(t => t.classList.remove('active'));
    document.querySelectorAll('.tab-content').forEach(t => t.classList.remove('active'));
    document.getElementById('tab-' + name).classList.add('active');
    if (el) el.classList.add('active');
}

// ===== 环形图 =====
function drawDonut(segments) {
    const svg = document.getElementById('donutChart');
    const cx = 80, cy = 80, r = 60, stroke = 18;
    const circumference = 2 * Math.PI * r;
    let offset = 0;
    let html = `<circle cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="var(--bg-secondary)" stroke-width="${stroke}"/>`;
    segments.forEach(seg => {
        const len = (seg.pct / 100) * circumference;
        const gap = 2;
        html += `<circle cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="${seg.color}" stroke-width="${stroke}" stroke-dasharray="${Math.max(0, len - gap)} ${circumference - Math.max(0, len - gap)}" stroke-dashoffset="${-offset}" stroke-linecap="round" transform="rotate(-90 ${cx} ${cy})" style="cursor:pointer;transition:opacity 0.2s;" onclick="drillDown('${seg.key}')"/>`;
        offset += len;
    });
    svg.innerHTML = html;
    // Legend
    const legend = document.getElementById('donutLegend');
    legend.innerHTML = segments.map(s => `<div class="legend-item" onclick="drillDown('${s.key}')"><span class="legend-dot" style="background:${s.color}"></span>${s.label}<span class="legend-pct">${s.pct}%</span></div>`).join('');
}

// ===== 穿透 =====
let currentDrill = null;
function drillDown(key) {
    const panel = document.getElementById('drillPanel');
    if (currentDrill === key) { currentDrill = null; panel.classList.remove('active'); return; }
    currentDrill = key;
    let items = [];
    if (key === 'stock') {
        const stocks = DATA.agongzi.stocks.map(calcStock).sort((a,b) => b.market - a.market);
        const total = stocks.reduce((s,x) => s + x.market, 0);
        items = stocks.map(s => ({ name: s.name, value: s.market, pct: (s.market/total*100).toFixed(1), color: 'var(--accent-light)' }));
    } else if (key === 'fund') {
        const funds = DATA.alipay.funds.map(calcFund).sort((a,b) => b.market - a.market);
        const total = funds.reduce((s,x) => s + x.market, 0);
        items = funds.map(f => ({ name: f.name, value: f.market, pct: (f.market/total*100).toFixed(1), color: 'var(--down)' }));
    } else if (key === 'gold') {
        items = [{ name: '博时黄金ETF联接C', value: 117798.72, pct: '72.0', color: 'var(--gold)' }, { name: '招行黄金账户', value: 46450.55, pct: '28.0', color: '#b48250' }];
    } else if (key === 'fixed') {
        items = [{ name: '招行理财产品', value: 109059, pct: '82.9', color: 'var(--warning)' }, { name: '余额宝', value: 22416, pct: '17.1', color: '#94a3b8' }];
    } else if (key === 'cash') {
        items = [{ name: 'A公子可用', value: DATA.agongzi.cash, pct: '90.5', color: 'var(--accent-light)' }, { name: '招行现金', value: DATA.zhaohang.cash, pct: '9.5', color: '#94a3b8' }];
    }
    panel.innerHTML = items.map(i => `<div class="drill-item"><div><div class="drill-name">${i.name}</div><div class="drill-bar"><div class="drill-bar-fill" style="width:${i.pct}%;background:${i.color}"></div></div></div><div class="drill-value">¥${fmt(i.value)} <span style="font-size:9px;opacity:0.7">${i.pct}%</span></div></div>`).join('');
    panel.classList.add('active');
}

}

// 新浪财经API: https://hq.sinajs.cn/list=sh601318,sz002384,sh600183,sh603256,sh601208,sh588290,sh603986
// 代码格式: sh=上海, sz=深圳

const STOCK_CODES = {
    '601318.SH': 'sh601318',  // 中国平安
    '002384.SZ': 'sz002384',  // 东山精密
    '600183.SH': 'sh600183',  // 生益科技
    '603256.SH': 'sh603256',  // 宏和科技
    '601208.SH': 'sh601208',  // 东材科技
    '588290.SH': 'sh588290',  // 科创芯片ETF
    '603986.SH': 'sh603986'   // 兆易创新
};

// 解析新浪返回数据
function parseSinaData(data, code) {
    // 格式: var hq_str_sh601318="中国平安,53.68,53.50,53.68,54.20,53.30,53.68,53.69,123456,6655443322,100,53.68,200,53.69...";
    const match = data.match(/"([^"]+)"/);
    if (!match) return null;
    const parts = match[1].split(',');
    if (parts.length < 3) return null;
    return {
        name: parts[0],
        open: parseFloat(parts[1]),
        close: parseFloat(parts[2]),
        current: parseFloat(parts[3]),
        high: parseFloat(parts[4]),
        low: parseFloat(parts[5]),
        buy: parseFloat(parts[6]),
        sell: parseFloat(parts[7]),
        volume: parseInt(parts[8]),
        amount: parseFloat(parts[9])
    };
}

// 获取实时价格
async function fetchRealTimePrices() {
    const codes = Object.values(STOCK_CODES).join(',');
    try {
        // 使用JSONP方式请求新浪财经API
        const script = document.createElement('script');
        script.src = `https://hq.sinajs.cn/list=${codes}`;
        script.onload = () => {
            // 解析返回的数据
            Object.entries(STOCK_CODES).forEach(([ourCode, sinaCode]) => {
                const data = window[`hq_str_${sinaCode}`];
                if (data) {
                    const parsed = parseSinaData(`"${data}"`, sinaCode);
                    if (parsed) {
                        updateStockPrice(ourCode, parsed.current);
                    }
                }
            });
            // 刷新显示
            render();
        };
        document.head.appendChild(script);
        // 清理script标签
        setTimeout(() => script.remove(), 5000);
    } catch (e) {
        console.error('获取实时行情失败:', e);
    }
}

// 更新股票价格
function updateStockPrice(code, price) {
    // 更新A公子持仓价格
    DATA.agongzi.stocks.forEach(s => {
        if (s.code === code) {
            s.price = price;
        }
    });
}

// 定时刷新（每30秒）
setInterval(fetchRealTimePrices, 30000);

// 首次加载获取实时价格
fetchRealTimePrices();

render();
</script>
